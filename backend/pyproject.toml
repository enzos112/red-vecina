[project]
name = "red-vecina"
version = "0.1.0"
description = "Red Vecina: programa de puntos compartido entre comercios de barrio"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "tzdata>=2025.1",
    "anthropic>=2.8",
    "google-genai>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pillow>=11.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
