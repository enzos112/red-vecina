# Blueprint de Render: un solo Web Service con Docker (API + frontend compilado).
# Los valores de las variables se cargan en el panel de Render; aquí van solo los nombres.
services:
  - type: web
    name: red-vecina
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: ENTORNO
        value: produccion
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: LECTOR_PROVEEDOR
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CONTACTO_WHATSAPP
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
